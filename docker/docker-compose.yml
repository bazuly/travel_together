services:
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    driver: local