services:
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env.test
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql

  cache:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    container_name: rabbitmq
    image: "rabbitmq:4.2-management-alpine"
    ports:
      - "15672:15672"
      - "5672:5672"
    hostname: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pdf-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uv", "run", "python", "-m", "app.worker.consumer"]
    env_file: ../.env
    working_dir: /app
    volumes:
      - ./media:/app/media
    depends_on:
      rabbitmq: { condition: service_healthy }
      db: { condition: service_started }


volumes:
  db_data:
    driver: local
  cache_data:
    driver: local