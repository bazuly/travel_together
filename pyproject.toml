[project]
name = "travel-together"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.30.0",
    "factory-boy>=3.3.3",
    "faker>=38.2.0",
    "fastapi>=0.120.0",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "jose>=1.0.0",
    "jwt>=1.4.0",
    "make>=0.1.6.post2",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.11.9",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "python-jose>=3.5.0",
    "redis>=7.1.0",
    "ruff>=0.14.2",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

# настройки для докера
# TODO: добавить описание в уроке как и что и зачем работает
# у нас тут, для понимания, прописаны настройки
# которые указывает докеру, что копировать, а что нет
# точнее не докеру, а утилите setuptools
[tool.setuptools.packages.find]
# Искать пакеты в текущей директории
where = ["."]
# Включить только пакет 'app'
include = ["app*"]
# Исключить папку Alembic из обнаружения пакетов
exclude = ["alembic*"]
